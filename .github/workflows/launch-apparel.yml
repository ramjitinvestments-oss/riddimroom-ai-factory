name: Launch Apparel (Production)

# Runs the existing, unmodified production launch pipeline
# (`npm run launch:apparel`) exactly as it runs locally — this workflow adds
# no pipeline logic of its own. It exists only to run that same command from
# a machine with unrestricted outbound network access (Printify and
# Shopify's OAuth endpoint are unreachable from Claude's own sandbox — see
# docs/gold-turntable-regeneration-runbook.md).
#
# `npm run launch:apparel` already runs its own pre-flight check
# (scripts/preflight-check.ts) and aborts before any Printify/Shopify write
# if anything required is missing or unreachable — this workflow does not
# duplicate that validation, it only supplies the secrets that check reads.

# CHANGED 2026-08-05: the `push` trigger below is intentionally removed.
# Root cause of a real production incident: this workflow's launch step has
# no memory across separate GitHub Actions runs (each run is a fresh
# checkout; the generated designs/processed/*.json files that
# scripts/import-artwork.ts uses to detect "already done" are gitignored,
# never committed). Every ordinary code-fix commit pushed to master while
# debugging a failed launch re-triggered this workflow and re-ran the
# *entire* batch from scratch, creating duplicate Shopify products for
# every design that had already succeeded. `workflow_dispatch` (which
# still requires typing LAUNCH) is now the only trigger — a production
# launch must always be a deliberate, explicit action, never a side effect
# of pushing an unrelated code change.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type LAUNCH to confirm — this makes real Printify/Shopify writes.'
        required: true
        type: string

# Only one production launch at a time. Queues rather than cancels an
# in-flight run, since cancelling mid-launch could leave a design partially
# updated — "never duplicate products" depends on a launch always running
# to completion or a clean stop, not being interrupted by a second trigger.
concurrency:
  group: launch-apparel-production
  cancel-in-progress: false

jobs:
  launch:
    name: Run production launch
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Verify confirmation input
        # BUGFIX 2026-08-05: this previously ran unconditionally on every trigger.
        # On a `push` event, `github.event.inputs` is null (only `workflow_dispatch`
        # populates it), so the old `github.event.inputs.confirm != 'LAUNCH'` check
        # evaluated `null != 'LAUNCH'` — always true — and aborted every push-triggered
        # run before checkout, even though the `push` trigger was intentionally built
        # to require no confirmation (see the `on:` block above). Confirmed via GitHub
        # Actions run history: every prior run (workflow_dispatch AND push) failed at
        # this exact step in ~5s, before a single Printify/Shopify call was made.
        # Scoping the check to workflow_dispatch only restores the intended behavior.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'LAUNCH' }}
        run: |
          echo "::error::Confirmation input did not match 'LAUNCH' — aborting before any production call."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production launch
        id: launch
        run: npm run launch:apparel
        env:
          DRY_RUN: "false"
          NODE_ENV: production
          # --- Shopify (OAuth client credentials grant — see automation/shopify/create-provider.ts) ---
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          # --- Printify (see automation/printify/create-provider.ts) ---
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          PRINTIFY_BLUEPRINT_ID: ${{ secrets.PRINTIFY_BLUEPRINT_ID }}
          PRINTIFY_PRINT_PROVIDER_ID: ${{ secrets.PRINTIFY_PRINT_PROVIDER_ID }}
          PRINTIFY_VARIANT_IDS: ${{ secrets.PRINTIFY_VARIANT_IDS }}
          PRINTIFY_BLACK_VARIANT_IDS: ${{ secrets.PRINTIFY_BLACK_VARIANT_IDS }}
          # --- OpenAI (only used if a design still needs metadata generated — see automation/ai) ---
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # --- Optional overrides — safe to leave unset as GitHub secrets; the pipeline falls back
          #     to its own defaults (see .env.example) when these are blank. ---
          # Placement below is set as a literal, not a secret, for this specific launch batch
          # (the "Caribbean Dictionary Series" designs). Those PNGs are content-cropped to their
          # own tall aspect ratio (~4500x5390, h/w ~1.19-1.20), not padded to the fixed 4500x5400
          # canvas the PrintifyApiProvider defaults (0.5/0.35/0.85) were tuned against — using the
          # secrets-sourced defaults here would clip roughly the top 8% of every one of these
          # designs. y=0.4655/scale=0.88 is computed from this batch's own worst-case aspect ratio
          # (see designs/processed/*.png dimensions) so the top edge sits ~3% below the print
          # area's top with no clipping, matching the "raised as high as possible" placement
          # standard already applied by hand to the first 5 live products. Revert these three
          # lines back to secrets.PRINTIFY_PRINT_X/Y/SCALE refs once padded-canvas designs are
          # launched again through this workflow.
          PRINTIFY_PRINT_X: "0.5"
          PRINTIFY_PRINT_Y: "0.4655"
          PRINTIFY_PRINT_SCALE: "0.88"
          DEFAULT_SHIRT_PRICE: ${{ secrets.DEFAULT_SHIRT_PRICE }}
          # Scopes this run to only the newly-imported batch — the original 4 reference products
          # (GOLDEN turntable/crown/RR shirt 1/treasure chest) already have the manually-verified
          # "Align top" placement live; re-running them through the PRINTIFY_PRINT_Y override above
          # would overwrite that fix. See scripts/launch-apparel.ts's designStemsFromEnv().
          #
          # CHANGED 2026-08-05: "Big Up" removed from this list. The first attempt at this batch
          # (run 31031719307) created Big Up's Printify product then failed the color-switch update
          # with error 8251 (root-caused and fixed across commits 1266f15/98dc0a5/4f5a801 in
          # automation/printify/printify-provider.ts). Since designs/processed/Big Up.*.json is
          # gitignored, that partially-created product had no local record for this workflow's
          # duplicate-title guard to find, and AI-generated titles aren't guaranteed stable across
          # runs -- re-running Big Up through the normal create path here risked a second product
          # instead of reusing the one that already exists. It was reconciled in place by hand via
          # scripts/reconcile-orphan-printify-product.ts (see designs/published/Big Up.printify.json)
          # and is now fully live; this list only needs to (re)launch the remaining 8.
          LAUNCH_DESIGN_STEMS: "Chipping,Irie,Liming,Pickney,Riddim,Soon Come,Watch Nah,Wgagwaan"
          # Explicitly empty: preflight's default pendingStems (crown/RR shirt 1/treasure chest)
          # were published by hand in an earlier session and their designs/processed/*.png source
          # files were never committed to this repo — a fresh checkout (this runner) fails
          # preflight's "Artwork present" check for them even though this run doesn't touch them.
          # See scripts/launch-apparel.ts's pendingStemsFromEnv() doc comment.
          PREFLIGHT_PENDING_STEMS: ""

      - name: Summarize launch report
        if: always()
        run: |
          REPORT=$(ls -t logs/launch-report-*.json 2>/dev/null | head -n 1 || true)
          if [ -z "$REPORT" ]; then
            {
              echo "## Launch summary"
              echo ""
              echo "No launch report was written — the run stopped at pre-flight, before any design was attempted."
              echo "See the \"Run production launch\" step's log above for exactly which pre-flight checks failed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## Launch summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report: \`$REPORT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node --eval '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const rows = [];
            for (const d of report.designs) {
              if (d.outcome === "failed") {
                rows.push(`| ${d.designStem} | FAILED | — | — | ${d.error ?? ""} |`);
              } else {
                rows.push(`| ${d.designStem} | ${d.outcome === "updated" ? "Updated" : "Created"} | ${d.printifyProductId ?? ""} | ${d.shopifyProductId ?? ""} | |`);
              }
            }
            const lines = [
              `**Result:** ${report.succeeded ? "SUCCESS — every design launched" : "STOPPED — see below"}`,
              "",
              "| Design | Outcome | Printify ID | Shopify ID | Error |",
              "|---|---|---|---|---|",
              ...rows,
              "",
              `Started: ${report.startedAt}`,
              `Finished: ${report.finishedAt}`,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          ' "$REPORT"

      - name: Upload launch report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-apparel-report-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 90
